<div class="cd"><div class="ch"><b>ຂໍ້ມູນຮ້ານ</b></div>
<span class="sl">ຊື່ຮ້ານ</span><input data-k="name" maxlength="40" value="${esc(SET.name)}" placeholder="ຊື່ຮ້ານ">
<span class="sl">ໂລໂກ້ຮ້ານ</span><div style="width:110px">${ibox('logo','sq ct','ໂລໂກ້')}</div>
<span class="sl">ຮູບໜ້າຮ້ານ</span>${ibox('front','wd','ຮູບໜ້າຮ້ານ')}</div>
<div class="cd"><div class="ch"><b>ໝວດໝູ່ສິນຄ້າ</b><span>4 ໝວດ</span></div><div class="cg">${SET.cats.map((c,i)=>`<div class="sbx">${ibox('c'+i,'sq','ຮູບໝວດ '+(i+1))}<input data-k="c${i}" maxlength="20" value="${esc(c.name)}" placeholder="ຊື່ໝວດໝູ່ ${i+1}"></div>`).join('')}</div></div>
<div class="cd"><div class="ch"><b>ຊ່ອງທາງຕິດຕໍ່ລູກຄ້າ</b><span>4 ຊ່ອງ</span></div>${SET.links.map((x,i)=>`<div class="lr"><input data-k="l${i}l" maxlength="20" value="${esc(x.l)}" placeholder="ຊື່ຊ່ອງທາງ"><input data-k="l${i}u" inputmode="url" value="${esc(x.u)}" placeholder="https://…"></div>`).join('')}<div class="sub">ເວັ້ນວ່າງໄວ້ = ບໍ່ສະແດງຊ່ອງນັ້ນ</div></div>
<div class="cd"><div class="ch"><b>QR ຮັບໂອນເງິນ</b></div><div style="max-width:220px">${ibox('qr','sq ct','ໃສ່ QR')}</div></div>
<div class="cd"><div class="ch"><b>ຮູບໂປຣໂມຊັນຕອນເຂົ້າເວັບ</b></div>${ibox('promo','wd','ຮູບໂປຣໂມຊັນ')}<label class="tg"><input type="checkbox" data-k="promoOn" ${SET.promoOn?'checked':''}>ສະແດງປ໊ອບອັບນີ້ຕອນລູກຄ້າເຂົ້າເວັບ</label></div>
<div class="cd"><div class="ch"><b>ລິ້ງແຈ້ງເຕືອນແອດມິນ</b></div>
<span class="sl">ເມື່ອມີຄົນເຕີມເງິນ</span><input data-k="nTop" inputmode="url" value="${esc(SET.nTop)}" placeholder="https://…">
<span class="sl">ເມື່ອມີຄົນສະໝັກໃໝ່</span><input data-k="nReg" inputmode="url" value="${esc(SET.nReg)}" placeholder="https://…">
<div class="sub">ໃສ່ລິ້ງ Webhook (ເຊັ່ນ Discord / Telegram) ເພື່ອໃຫ້ລະບົບສົ່ງແຈ້ງເຕືອນ</div></div>
<button class="hb" id="sSave">ບັນທຶກການຕັ້ງຄ່າ</button>`}
function initSet(){paintSet();const pt=q('#pg-settings'),U=/^https?:\/\/\S+$/i;
const setK=(k,v)=>{if(k==='name'||k==='nTop'||k==='nReg')SET[k]=v;else if(k==='promoOn')SET.promoOn=v;else if(/^c\d$/.test(k))SET.cats[+k[1]].name=v;else{const m=k.match(/^l(\d)([lu])$/);if(m)SET.links[+m[1]][m[2]]=v}};
pt.addEventListener('input',e=>{const k=e.target.dataset.k;if(k&&e.target.type!=='checkbox')setK(k,e.target.value)});
pt.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.rm){simg(b.dataset.rm,'');const y=scrollY;paintSet();scrollTo(0,y);return}
if(b.id==='sSave'){if(!SET.name.trim())return toast('ໃສ່ຊື່ຮ້ານກ່ອນ');
const bad=[...SET.links.map(x=>x.u),SET.nTop,SET.nReg].map(v=>v.trim()).find(v=>v&&!U.test(v));
if(bad)return toast('ລິ້ງຕ້ອງຂຶ້ນຕົ້ນດ້ວຍ http:// ຫຼື https://');
toast('ບັນທຶກແລ້ວ (ໂໝດທົດລອງ — ຍັງບໍ່ເກັບຖາວອນ)')}});
pt.addEventListener('change',e=>{const t=e.target;
if(t.dataset.k==='promoOn')return setK('promoOn',t.checked);
const k=t.dataset.f;if(!k||!t.files[0])return;
const f=new FileReader();f.onload=()=>{const im=new Image();im.onload=()=>{const keep=k==='logo'||k==='qr',mx=k==='logo'?256:k==='qr'?640:900,sc=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;const g=c.getContext('2d');if(!keep){g.fillStyle='#000';g.fillRect(0,0,c.width,c.height)}g.drawImage(im,0,0,c.width,c.height);simg(k,keep?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.82));const y=scrollY;paintSet();scrollTo(0,y)};im.onerror=()=>toast('ໄຟລ໌ຮູບນີ້ເປີດບໍ່ໄດ້');im.src=f.result};f.readAsDataURL(t.files[0])})}
const CH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
let H=null,first=true;
const toast=x=>{const e=q('#ts');e.textContent=x;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2400)};
const sheet=(html,onOpen)=>{q("#shb").innerHTML=html;q('#so').classList.add('on');q('#sh').classList.add('on');onOpen&&onOpen()};
const closeSheet=()=>{q('#so').classList.remove('on');q('#sh').classList.remove('on')};
function countUp(el,to){const t0=performance.now(),D=1100;const f=t=>{const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);el.textContent=fm(to*e);if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function paint(){
const p=H.period,days=Math.min(7,(Date.now()-p.started)/DAY),done=days>=7;
const grp={o:[],l:[],r:[],k:0};H.products.forEach(x=>{const s=x[1];s<=0?grp.o.push(x):s<=LOW?grp.l.push(x):s<=RES?grp.r.push(x):grp.k++});
const row=(c,x)=>`<div class="hr st" style="--c:var(--cc)"><i class="dot" style="--c:${c}"></i><div><b>${esc(x[0])}</b></div><span>${x[1]} ຊິ້ນ</span></div>`;
const lst=(c,a)=>a.map(x=>row(c,x)).join('');
q('#pg-home').innerHTML=`<span class="dm">ຂໍ້ມູນທົດລອງ (DEMO)</span>
<div class="cd hero"><div class="ch"><b>ຍອດເຕີມເງິນທັງໝົດ</b><span>ສະເພາະລູກຄ້າ</span></div><div class="big" id="hTot">${fm(first?0:H.total_all)}</div><div class="sub">${H.topup_count} ລາຍການ · ${H.customers} ລູກຄ້າ (ບໍ່ນັບແອດມິນ)</div></div>
<div class="cd"><div class="ch"><b>ຍອດຮອບ 7 ວັນ</b><span>${fd(p.started)} – ${fd(p.started+7*DAY)}</span></div><div class="big" style="font-size:26px">${fm(p.total)}</div><div class="sub">${p.count} ລາຍການ</div>
<div class="bar2"><i id="hBar"></i></div><div class="sub" style="margin:0">ມື້ທີ ${Math.min(7,Math.floor(days)+1)} / 7</div>
${done?'<div class="wn">ຄົບ 7 ວັນແລ້ວ — ຄວນປິດຮອບ ແລະ ເລີ່ມນັບໃໝ່</div>':''}
<button class="hb" id="hClose">ປິດຮອບ ແລະ ເລີ່ມນັບໃໝ່</button>
<div class="ch" style="margin:16px 0 2px"><b>ຮອບກ່ອນໜ້າ</b><span>${H.history.length} ຮອບ</span></div>
${H.history.length?H.history.map(r=>`<button class="hr" data-h="${r.id}"><div><b>${fd(r.s)} – ${fd(r.e)}</b><small>${r.count} ລາຍການ${r.note?' · '+esc(r.note):''}</small></div><span>${fm(r.total)}</span>${CH}</button>`).join(''):'<div class="em">ຍັງບໍ່ມີຮອບທີ່ບັນທຶກ</div>'}</div>
<div class="cd"><div class="ch"><b>ແຈ້ງເຕືອນສະຕັອກ</b><span>${H.products.length} ສິນຄ້າ</span></div>
<div class="chips"><div class="chip o"><b>${grp.o.length}</b><small>ໝົດແລ້ວ</small></div><div class="chip l"><b>${grp.l.length}</b><small>ໃກ້ໝົດ</small></div><div class="chip r"><b>${grp.r.length}</b><small>ຄວນເຕີມ</small></div></div>
${lst('#ff4560',grp.o)}${lst('#ff9a3d',grp.l)}${lst('#ffc233',grp.r)}
${grp.o.length+grp.l.length+grp.r.length?'':'<div class="em">ສະຕັອກປົກກະຕິທຸກລາຍການ 🎉</div>'}
<div class="lg2">ໃກ້ໝົດ ≤ ${LOW} ຊິ້ນ · ຄວນເຕີມ ≤ ${RES} ຊິ້ນ · ສະຕັອກປົກກະຕິ ${grp.k} ລາຍການ</div></div>
<div class="cd"><div class="ch"><b>ເຕີມເງິນຫຼ້າສຸດ</b><span>ລູກຄ້າ</span></div>
${H.recent.length?H.recent.map(r=>`<div class="hr st"><div><b>${esc(r.u)}</b><small>${ago(r.t)}</small></div><span>+${fm(r.a)}</span></div>`).join(''):'<div class="em">ຍັງບໍ່ມີການເຕີມເງິນ</div>'}</div>`;
if(first){countUp(q('#hTot'),H.total_all);first=false}
requestAnimationFrame(()=>requestAnimationFrame(()=>{const b=q('#hBar');if(b)b.style.width=(days/7*100)+'%'}));
}
async function loadHome(){H=await API.home();paint()}
function initHome(){
loadHome();
q('#pg-home').addEventListener('click',e=>{
if(e.target.closest('#hClose')){const p=H.period;sheet(`<h3>ປິດຮອບນີ້ບໍ?</h3><p>ຍອດ ${fm(p.total)} (${p.count} ລາຍການ) ຈະຖືກບັນທຶກໄວ້ ແລ້ວເລີ່ມນັບຮອບໃໝ່ຈາກ 0 · ກັບມາເບິ່ງຮອບເກົ່າໄດ້</p><input id="hNote" maxlength="200" placeholder="ໝາຍເຫດ (ບໍ່ບັງຄັບ)"><button class="hb" id="hOk">ຢືນຢັນປິດຮອບ</button><button class="hb gh" id="hNo">ຍົກເລີກ</button>`);return}
const r=e.target.closest('[data-h]');if(r){const x=H.history.find(v=>v.id==r.dataset.h);if(!x)return;
sheet(`<h3>ຮອບ ${fd(x.s)} – ${fd(x.e)}</h3><p>ຂໍ້ມູນທີ່ບັນທຶກໄວ້ ບໍ່ປ່ຽນແປງ</p><div class="big" style="font-size:26px;margin-bottom:8px">${fm(x.total)}</div><div class="kv"><span>ຈຳນວນລາຍການ</span><b>${x.count}</b></div><div class="kv"><span>ເລີ່ມ</span><b>${fdt(x.s)}</b></div><div class="kv"><span>ປິດຮອບ</span><b>${fdt(x.e)}</b></div><div class="kv"><span>ໝາຍເຫດ</span><b>${x.note?esc(x.note):'-'}</b></div><button class="hb gh" id="hNo">ປິດ</button>`)}});
q('#sh').addEventListener('click',async e=>{
if(e.target.closest('#hNo'))closeSheet();
if(e.target.closest('#hOk')){const n=q('#hNote').value;closeSheet();await API.closePeriod(n);await loadHome();toast('ບັນທຶກຮອບແລ້ວ — ເລີ່ມນັບຮອບໃໝ່')}});
q('#so').addEventListener('click',closeSheet);
}
(async()=>{
try{
const {data}=await sb.auth.getSession();
if(!data||!data.session){home();return}
const {data:ok,error}=await sb.rpc('is_admin');
if(error||ok!==true){home();return}
const u=data.session.user,nm=(u.user_metadata&&u.user_metadata.username)||'';
const w=document.getElementById('who');w.hidden=false;w.textContent='ADMIN · '+nm.toUpperCase();document.body.classList.add('ok');initTabs();initProd();initHome();initAcc();initSet();
}catch(e){home()}
})();
</script></body></html>
